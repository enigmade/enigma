# Enigma OS bootloader configuration (Calamares)
# Per SPEC §1: systemd-boot primary (UEFI), GRUB fallback (BIOS)
# Per SPEC §20.12: keep tested GRUB path until Phase 8

---
# UEFI systemd-boot (primary)
efiBootLoader: systemd-boot

# GRUB fallback for BIOS/legacy systems (kept until P8)
grubInstall: auto
grubBios: true

# grub-btrfs integration (Phase 2 decision: generate snapshot entries for GRUB)
grubBtrfs: true
grubBtrfsLimit: 5

# Timeout: hold key to show menu (SPEC §10)
timeout: 0

# Use kernel parameters from the system
useGrubTheme: false
