# Enigma OS post-install packages (Calamares)
# Per SPEC §3 & Phase 2: same minimal live set + installer/snapshot packages

---
backend: pacman

# Use same package list as live environment
pacmanConf: /etc/pacman.conf

# Post-install packages (dependencies + extras for installed system)
packages:
  - base
  - linux-cachyos
  - linux-lts
  - linux-firmware
  - linux-firmware-nonfree
  - cachyos-keyring
  - cachyos-mirrorlist
  - systemd
  - systemd-boot
  - grub
  - efibootmgr
  - os-prober
  - btrfs-progs
  - snapper
  - snap-pac
  - grub-btrfs
  - networkmanager
  - wpa_supplicant
  - dhclient
  - bash
  - zsh
  - sudo
  - vim
  - nano
  - git
  - curl
  - wget
  - htop
  - tmux
  - which
  - plasma-desktop
  - plasma-workspace
  - plasma-wayland-session
  - kf6-kirigami
  - kf6-syntax-highlighting
  - dolphin
  - konsole
  - kate
  - gwenview
  - vlc
  - pipewire
  - pipewire-alsa
  - pipewire-jack
  - wireplumber
  - sddm
  - sddm-kcm
  - base-devel
  - gcc
  - make
  - cmake
  - pkgconf
  - adobe-source-code-pro-fonts
  - inter-font
  - ttf-jetbrains-mono-nerd
  - noto-fonts
  - noto-fonts-cjk
  - noto-fonts-emoji
  - nftables
  - apparmor
  - tlp
  - tlp-rdw
  - udev
  - udisks2
  - udisks2-qt
  - podman
  - podman-docker
  - efibootmgr
  - lsb-release
  - lshw
  - pciutils
  - usbutils
  - firefox
  - ublock-origin
  - beekeeper-studio-community

# Skip weak dependency resolution
ignorePackageConf: false
