# Enigma OS user configuration (Calamares)
# Per SPEC §6: simple path: pick username, done

---
# Ensure wheel group for sudo access
groups:
  - name: wheel
    must-exist: true

# User is added to wheel for passwordless sudo (via /etc/sudoers.d)
userGroup: wheel

# Set user shell
userShell: /bin/bash

# Auto-login is disabled for security; KDE will prompt for password
setRootPassword: false

# Allow empty passwords (not recommended, but don't force complexity)
allowWeakPasswords: false
