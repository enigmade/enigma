# Enigma OS partition configuration (Calamares)
# Per SPEC §1: Btrfs subvolumes @, @home, @snapshots, @var_log
# Per SPEC §7: LUKS2 full-disk encryption optional checkbox
# Per SPEC §6: os-prober for dual-boot detection

---
# Mount options for Btrfs subvolumes
btrfsOptions: "defaults,noatime,compress=zstd"
btrfsRootVolumeLabel: "@"

# Btrfs subvolume layout
btrfsSubvolumes:
  - "@"
  - "@home"
  - "@snapshots"
  - "@var_log"

# Partition defaults
defaultFileSystemType: "btrfs"

# Enable user-accessible encryption (LUKS2 checkbox in installer)
enableEncryption: true
encryptionType: "luks2"

# Dual-boot detection via os-prober
detectOtherOSes: true

# Do not use swap file on Btrfs (SPEC §1: zram only)
noSwap: true

# Use EFI boot (systemd-boot primary, GRUB fallback)
efiBootLoader: systemd-boot
