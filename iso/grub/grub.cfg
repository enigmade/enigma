	echo 'Loading Enigma OS (Live — Load to RAM)...'
	search --no-floppy --label %ARCHISO_LABEL% --set root
	echo 'Loading Linux cachyos...'
	linux	/arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch archisodevice=UUID=%ARCHISO_UUID% copytoram cow_spacesize=2G modprobe.blacklist=sp5100_tco,gpio_ich enigma_mode=live
	echo 'Loading initial ramdisk...'
