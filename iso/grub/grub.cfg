	linux	/arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch archisodevice=UUID=%ARCHISO_UUID% cow_spacesize=2G modprobe.blacklist=sp5100_tco,gpio_ich enigma_mode=live
