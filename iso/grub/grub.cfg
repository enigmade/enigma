# Enigma OS GRUB configuration (BIOS fallback per SPEC §1)
# Generated by archiso; may be edited

search --no-floppy --label %ARCHISO_LABEL% --set root

insmod gzio
insmod part_msdos
insmod ext2

if [ x$feature_platform_search_hint = xy ]; then
  search --no-floppy --label %ARCHISO_LABEL% --set root --hint-ieee1275='ieee1275//disk@0,msdos2' --hint-efi='hd0,msdos2' --hint-baremetal=ahci0,msdos2  --hint='hd0,msdos2'
else
  search --no-floppy --label %ARCHISO_LABEL% --set root
fi

set prefix=($root)/arch/boot/grub

function gfxmode {
	set gfxpayload="${1}"
	if [ "${1}" = "keep" ]; then
		set gfxpayload=keep
	fi
}

if [ "${recordfail}" != 1 ]; then
  if [ -e ($root)/boot/grub/gfxblacklist.txt ]; then
    if [ "${1}" != --only-once ]; then
      set linux_gfx_mode=auto
    else
      set linux_gfx_mode=text
    fi
  else
    set linux_gfx_mode=auto
  fi
fi

export linux_gfx_mode
if [ "${linux_gfx_mode}" != "text" ]; then
	load_video
	set gfxmode=${linux_gfx_mode}
else
	set gfxmode=1024x768
fi
gfxmode $gfxmode

insmod gzio
if [ x$grub_platform = xefi ]; then
  insmod part_gpt
  insmod fat
  set root='hd0,gpt2'
fi

insmod play
play 480 440 1

menuentry "Enigma OS (Install)" --class arch --class gnu-linux --class os {
	echo 'Loading Enigma OS (Install)...'
	search --no-floppy --label %ARCHISO_LABEL% --set root
	echo 'Loading Linux cachyos...'
	linux	/arch/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=arch archisodevice=UUID=%ARCHISO_UUID% cow_spacesize=2G modprobe.blacklist=sp5100_tco,gpio_ich enigma_mode=install
	echo 'Loading initial ramdisk...'
	initrd	/arch/boot/x86_64/initramfs-linux-cachyos.img
}

