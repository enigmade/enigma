#
# /etc/pacman.conf - Enigma OS archiso pacman configuration
# Per SPEC §1 & §12: base Arch + CachyOS repos
#

[options]
Architecture = x86_64
CheckSpace
Color
VerbosePkgLists
ParallelDownloads = 8
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# CachyOS repositories (optimized packages per SPEC §1).
# Use the mirrorlists installed by cachyos-repo.sh on the build host — the
# x86-64-v3 repos take precedence over the baseline cachyos repo. mkarchiso
# resolves these Include paths against the host FS during pacstrap.
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist
