#
# /etc/pacman.conf - Enigma OS archiso pacman configuration
# Per SPEC §1 & §12: base Arch + CachyOS repos
#

[options]
Architecture = x86_64
CheckSpace
Color
VerbosePkgLists
ParallelDownloads = 8
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# CachyOS repositories (optimized packages per SPEC §1)
[cachyos]
Server = https://mirror.cachyos.org/repo/$arch

[cachyos-extra]
Server = https://mirror.cachyos.org/repo/$arch

[cachyos-core-dev]
Server = https://mirror.cachyos.org/repo/$arch
