# Enigma OS installer (Calamares). Overrides the config shipped by
# cachyos-calamares. Strategy: unpackfs copies the live squashfs onto the
# target (so the installed system == the live system), then we repair the
# things that copy cannot carry, and the packages module removes the
# installer. No large package re-install during setup.
---
modules-search: [ local, /usr/lib/calamares/modules ]

# Only shellprocess needs explicit instances (one config file per invocation).
# Every other module below runs as its default instance, which already reads
# <module>.conf from this directory.
instances:
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf
  - id: restoreboot
    module: shellprocess
    config: shellprocess-restoreboot.conf
  - id: initramfs
    module: shellprocess
    config: shellprocess-initramfs.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - removeuser
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      # --- repair what unpackfs cannot carry ------------------------------
      # Order here is load-bearing, do not shuffle:
      #   cleanup     strips live-only credentials/policy and replaces the
      #               archiso initramfs config — must precede `packages`,
      #               which deletes the archiso mkinitcpio hooks.
      #   restoreboot puts the kernel back in /boot; mkarchiso deletes /boot
      #               from the airootfs, so the target has no kernel at all.
      #   packages    removes the installer + live-only packages.
      #   initramfs   mkinitcpio -P, needs the kernel present and the archiso
      #               hooks gone.
      #   bootloader  writes boot entries, needs kernel + initramfs to exist.
      - shellprocess@cleanup
      - shellprocess@restoreboot
      - packages
      - shellprocess@initramfs
      - bootloader
      - umount
  - show:
      - finished

branding: enigmaos

prompt-install: true
dont-clear-password-fields: true
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
