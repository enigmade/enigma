# Configure SDDM on the installed system (Plasma Wayland session). The live
# autologin drop-in and the live user are stripped from the target by the
# removeuser + shellprocess-cleanup steps, so the installed system shows the
# normal SDDM login screen.
---
displaymanagers:
  - sddm

defaultDesktopEnvironment:
  executable: "startplasma-wayland"
  desktopFile: "plasma"

basicSetup: false
sysconfigSetup: false
