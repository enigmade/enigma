# Enigma OS partitioning (Calamares). Btrfs subvolumes per SPEC §1,
# optional LUKS2 full-disk encryption per SPEC §7, os-prober for dual boot.
---
efiSystemPartition: "/boot"
# The ESP is mounted at /boot, so it stores the kernels AND the initramfs
# images. mkinitcpio -P builds a default *and* a fallback image per preset, and
# SPEC §1 ships two kernel series (linux-cachyos + linux-lts fallback), so this
# partition holds ~6 files totalling a few hundred MB. 512M left no headroom
# and risked failing part-way through the install.
efiSystemPartitionSize: 1G

userSwapChoices:
  - none
  - zram

drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "btrfs"

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/log
    subvolume: /@var_log
  - mountPoint: /.snapshots
    subvolume: /@snapshots

enableLuksAutomatedPartitioning: true

initialPartitioningChoice: erase
initialSwapChoice: none
