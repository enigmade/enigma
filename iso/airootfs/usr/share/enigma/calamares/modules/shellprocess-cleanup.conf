# Turn the copied live root into a proper installed system: strip the live
# credentials/autologin/installer launchers and swap the archiso initramfs
# config for a disk-install one.
#
# Must run BEFORE the packages module (which removes mkinitcpio-archiso) and
# before shellprocess@initramfs. Logic lives in the script so it can be
# shellcheck-clean and reviewed as code.
---
dontChroot: false
timeout: 120
script:
  - "/usr/local/libexec/enigma-install-cleanup.sh"
