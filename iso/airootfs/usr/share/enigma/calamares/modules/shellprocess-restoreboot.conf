# Restore the kernel images into the target's /boot.
#
# mkarchiso strips /boot from the airootfs before building airootfs.sfs, so the
# target has NO kernel at all straight after unpackfs. Without this the install
# completes and then fails to boot. Full rationale in the script.
#
# dontChroot: true so the script can read the live medium at
# /run/archiso/bootmnt; Calamares expands ${ROOT} to the target mount point.
---
dontChroot: true
timeout: 300
script:
  - "/usr/local/libexec/enigma-install-restore-boot.sh ${ROOT}"
