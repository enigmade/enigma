# Copy the live root filesystem (squashfs) onto the installation target.
# archiso names the image airootfs.sfs under <install_dir>/<arch>/; with
# install_dir="arch" and arch="x86_64" it lives at the path below when the
# ISO is booted.
---
unpack:
  - source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""
