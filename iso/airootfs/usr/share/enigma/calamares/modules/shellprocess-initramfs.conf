# Generate the installed system's initramfs (mkinitcpio -P).
#
# Runs after the kernel has been restored to /boot, after the archiso
# mkinitcpio drop-in has been replaced, and after the packages module has
# removed mkinitcpio-archiso — so the generated image references only hooks
# that still exist. Must run BEFORE the bootloader module, which needs the
# initramfs present to write valid boot entries.
---
dontChroot: false
timeout: 900
script:
  - "/usr/local/libexec/enigma-install-initramfs.sh"
