# Enigma OS live initramfs configuration (drop-in overrides the stock
# /etc/mkinitcpio.conf that the mkinitcpio package installs).
#
# Two things here are load-bearing for the live ISO:
#   - the `archiso` hooks: without them the initramfs cannot locate/mount the
#     squashfs on the ISO/USB device, so every boot dies in the emergency shell.
#   - NO `autodetect` hook: autodetect trims modules to whatever the *build*
#     host (a CI container) has loaded, which strips USB HID/xHCI drivers and
#     leaves real hardware with a dead keyboard/mouse. The live image must
#     carry the full module set.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
