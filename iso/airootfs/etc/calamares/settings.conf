# Enigma OS installer (Calamares). Overrides the config shipped by
# cachyos-calamares. Strategy: unpackfs copies the live squashfs onto the
# target (so the installed system == the live system), then the packages
# module removes the installer. No large package re-install during setup.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: root
    module: partition
    config: partition.conf
  - id: users
    module: users
    config: users.conf
  - id: bootloader
    module: bootloader
    config: bootloader.conf
  - id: packages
    module: packages
    config: packages.conf
  - id: unpackfs
    module: unpackfs
    config: unpackfs.conf
  - id: displaymanager
    module: displaymanager
    config: displaymanager.conf
  - id: services
    module: services-systemd
    config: services-systemd.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - removeuser
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@cleanup
      - bootloader
      - packages
      - umount
  - show:
      - finished

branding: enigmaos

prompt-install: true
dont-clear-password-fields: true
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
