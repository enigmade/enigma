# The installed system is a copy of the live system (via unpackfs), so we do
# NOT install a package list here. Instead, remove the live/installer-only
# packages from the target so the installed system is clean.
---
backend: pacman

pacman:
  num_retries: 3
  disable_download_timeout: true
  needed_only: false

operations:
  - remove:
      - cachyos-calamares
      - calamares
      - mkinitcpio-archiso
      - syslinux
