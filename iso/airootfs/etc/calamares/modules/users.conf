# Enigma OS user setup (Calamares). Simple path: pick a username + password.
---
defaultGroups:
  - wheel
  - network
  - video
  - audio
  - storage
  - power
  - rfkill

autologinGroup: autologin
doAutologin: false

sudoersGroup: wheel
setRootPassword: false
doReusePassword: true

availableShells: /bin/bash, /bin/zsh
avatarFilePath: ""

userShell: /bin/bash

passwordRequirements:
  minLength: -1
  maxLength: -1
  libpwquality: []

allowWeakPasswords: true
allowWeakPasswordsDefault: true
