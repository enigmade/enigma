name: ISO Build (Arch container)

# Phases 1-2 gate: build the real Enigma OS ISO in an Arch Linux container.
# Runs separately from the main test workflow because it is heavy (GBs of
# downloads, tens of minutes). A fast package-resolution job gates the
# expensive mkarchiso build so bad package names fail in ~2 min, not ~30.

on:
  push:
    branches: [main]
    paths:
      - 'iso/**'
      - 'ci/qemu/**'
      - '.github/workflows/build-iso-real.yml'
  workflow_dispatch:

jobs:
  static-checks:
    name: Shellcheck + installer config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than apt's shellcheck: the runner image's version drifts
      # (24.04 ships 0.9.0), and each release adds or retunes checks, so an
      # unpinned linter turns a green gate red on an unrelated image bump.
      - name: Install shellcheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euxo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # CLAUDE.md: shellcheck-clean on all hooks.
      # Global exclusions, both deliberate patterns in the QEMU test harness:
      #   SC1091 - `source "$(dirname "$0")/common.sh"` cannot be followed
      #            statically; the path is correct at runtime.
      #   SC2064 - the EXIT traps intentionally expand now, capturing the
      #            temp-file paths that are already set at trap-definition time.
      # SC2034 is excluded only for profiledef.sh, whose variables are consumed
      # by mkarchiso sourcing the file rather than used locally.
      - name: Shellcheck all ISO/CI shell scripts
        run: |
          set -uo pipefail
          rc=0
          check() {
            # Last arg is the file; report it explicitly so a failure names the
            # script rather than leaving it to be inferred from the diagnostics.
            local f="${*: -1}"
            if ! shellcheck -e SC1091,SC2064 "$@"; then
              echo "::error file=${f}::shellcheck reported findings in ${f}"
              rc=1
            fi
          }
          while read -r f; do
            case "$f" in
              */profiledef.sh) check -e SC2034 "$f" ;;
              *)               check "$f" ;;
            esac
          done < <(find iso ci -type f \( -name '*.sh' -o -name 'profiledef.sh' \) | sort)
          # Extensionless scripts with a shell shebang (installer launchers).
          while read -r f; do
            if head -1 "$f" | grep -q '^#!.*\(bash\|sh\)'; then check "$f"; fi
          done < <(find iso/airootfs/usr/local/bin -type f | sort)
          [ $rc -eq 0 ] && echo "✓ shellcheck clean"
          exit $rc

      # Guards the class of bug that shipped an unbootable installed system:
      # mkarchiso deletes /boot from the airootfs, so unless the Calamares
      # sequence restores the kernel and regenerates the initramfs, every
      # install produces a machine that cannot boot.
      - name: Validate Calamares install sequence
        run: |
          set -euo pipefail
          cal=iso/airootfs/usr/share/enigma/calamares
          settings=$cal/settings.conf
          fail=0

          need_step() {
            grep -qE "^\s*-\s*$1\s*$" "$settings" \
              || { echo "::error::settings.conf exec sequence is missing '$1'"; fail=1; }
          }
          # Without these three the installed system has no kernel, no
          # initramfs, or boot entries pointing at files that do not exist.
          need_step "shellprocess@restoreboot"
          need_step "shellprocess@initramfs"
          need_step "bootloader"

          # Ordering is load-bearing: kernel restored -> initramfs built ->
          # bootloader entries written.
          order() { grep -nE "^\s*-\s*$1\s*$" "$settings" | head -1 | cut -d: -f1; }
          r=$(order "shellprocess@restoreboot"); i=$(order "shellprocess@initramfs")
          b=$(order "bootloader");              c=$(order "shellprocess@cleanup")
          u=$(order "unpackfs")
          for pair in "$u:$c" "$c:$r" "$r:$i" "$i:$b"; do
            a=${pair%:*}; z=${pair#*:}
            [ -n "$a" ] && [ -n "$z" ] && [ "$a" -lt "$z" ] || {
              echo "::error::Calamares exec steps are out of order (line $a must precede $z)"; fail=1; }
          done

          # Every module named in `instances:` must have its config present,
          # and every script a shellprocess invokes must exist + be executable.
          while read -r conf; do
            [ -f "$cal/modules/$conf" ] || { echo "::error::missing module config: $conf"; fail=1; }
          done < <(grep -oE 'config:\s*\S+' "$settings" | awk '{print $2}')

          while read -r script; do
            [ -x "iso/airootfs$script" ] || {
              echo "::error::installer script not found or not executable: $script"; fail=1; }
          done < <(grep -ohE '/usr/local/libexec/[a-z0-9-]+\.sh' "$cal"/modules/*.conf | sort -u)

          [ "$fail" -eq 0 ] && echo "✓ Calamares install sequence is complete and correctly ordered"
          exit $fail

  resolve-packages:
    name: Validate package list resolves
    needs: static-checks
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Refresh base + install tooling
        run: pacman -Syu --noconfirm archiso git curl sed grep

      - name: Enable CachyOS repositories
        run: |
          set -euxo pipefail
          # Retry helper: CachyOS mirrors occasionally reset the connection.
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed, retrying in 10s"; sleep 10; done; return 1; }

          pacman-key --init
          retry curl -fsSL https://mirror.cachyos.org/cachyos-repo.tar.xz -o /tmp/cachyos-repo.tar.xz
          tar xf /tmp/cachyos-repo.tar.xz -C /tmp
          # Run the official installer non-interactively, with retries. pipefail
          # is off for the pipe so `yes` dying via SIGPIPE doesn't mask the exit.
          install_cachyos() {
            set +o pipefail
            yes | (cd /tmp/cachyos-repo && ./cachyos-repo.sh --install)
            local rc=$?
            set -o pipefail
            return $rc
          }
          retry install_cachyos
          # The x86-64-v4 repos sometimes ship a db with a signature the shipped
          # keyring can't verify. We only use v3 + baseline cachyos (v3 runs on
          # any v4 CPU), so drop the v4 repo stanzas and refresh the keyring.
          sed -i '/^\[cachyos.*-v4\]/,+1d' /etc/pacman.conf
          pacman-key --populate cachyos
          retry pacman -Syy

      - name: Check every ISO package resolves
        run: |
          set -uo pipefail
          missing=()
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            case "$pkg" in \#*) continue;; esac
            if ! pacman -Si "$pkg" >/dev/null 2>&1; then
              missing+=("$pkg")
            fi
          done < <(grep -vE '^\s*#' iso/packages.x86_64 | sed 's/#.*//' | tr -d ' \t' | grep -v '^$')

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Unresolvable packages: ${missing[*]}"
            for pkg in "${missing[@]}"; do
              echo "--- candidates for '$pkg' ---"
              pacman -Ss "$pkg" 2>/dev/null | head -20 || echo "(no matches)"
            done
            exit 1
          fi
          echo "✓ All packages resolve"

  build-iso:
    name: Build ISO with mkarchiso
    needs: resolve-packages
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install archiso + repos
        run: |
          set -euxo pipefail
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed, retrying in 10s"; sleep 10; done; return 1; }

          # mkinitcpio: provides lsinitcpio for the initramfs verification step
          retry pacman -Syu --noconfirm archiso mkinitcpio git curl sed grep
          pacman-key --init
          retry curl -fsSL https://mirror.cachyos.org/cachyos-repo.tar.xz -o /tmp/cachyos-repo.tar.xz
          tar xf /tmp/cachyos-repo.tar.xz -C /tmp
          install_cachyos() {
            set +o pipefail
            yes | (cd /tmp/cachyos-repo && ./cachyos-repo.sh --install)
            local rc=$?
            set -o pipefail
            return $rc
          }
          retry install_cachyos
          # Drop the v4 repos (occasionally-broken db signature); v3 + baseline
          # cover us and run on any v4 CPU. Refresh the keyring + dbs.
          sed -i '/^\[cachyos.*-v4\]/,+1d' /etc/pacman.conf
          pacman-key --populate cachyos
          retry pacman -Syy

      - name: Build Enigma binaries into airootfs
        run: |
          set -euxo pipefail
          retry() { for i in 1 2 3; do "$@" && return 0; sleep 5; done; return 1; }
          retry pacman -S --noconfirm go
          mkdir -p iso/airootfs/usr/local/bin
          # Native linux/amd64 build of the enigma CLI + hwdetect (go.work ties
          # the two modules together), placed on the ISO at /usr/local/bin.
          go build -o iso/airootfs/usr/local/bin/enigma ./cli/cmd/enigma
          go build -o iso/airootfs/usr/local/bin/enigma-hwdetect ./hwdetect/cmd/enigma-hwdetect
          chmod +x iso/airootfs/usr/local/bin/enigma iso/airootfs/usr/local/bin/enigma-hwdetect
          ./iso/airootfs/usr/local/bin/enigma-hwdetect --help >/dev/null 2>&1 || true
          echo "✓ enigma + enigma-hwdetect built into airootfs"

      - name: Build ISO
        run: mkarchiso -v -w /tmp/work -o /tmp/out iso/

      - name: Verify boot structure (BIOS + UEFI)
        run: |
          set -euxo pipefail
          iso=$(ls /tmp/out/*.iso)
          # List El Torito boot images; a hybrid ISO must expose a BIOS boot
          # image AND an EFI (UEFI) boot image for the SPEC §1 boot matrix.
          xorriso -indev "$iso" -report_el_torito plain 2>&1 | tee /tmp/eltorito.txt
          grep -qiE 'BIOS|El Torito.*boot' /tmp/eltorito.txt
          grep -qi 'UEFI' /tmp/eltorito.txt
          # isohybrid MBR present => bootable when dd'd to a USB stick.
          file "$iso" | grep -qi 'DOS/MBR boot sector'
          echo "✓ ISO is hybrid-bootable: BIOS + UEFI El Torito entries present"

      - name: Verify live initramfs (archiso hook + USB input drivers)
        run: |
          set -euxo pipefail
          # mkarchiso moves boot images out of the airootfs into the ISO tree
          # (work/iso/arch/boot/...) and cleans the airootfs copy, so locate
          # the initramfs rather than hardcoding a stage-dependent path.
          initrd=$(find /tmp/work -name 'initramfs-linux-cachyos.img' -print -quit)
          test -n "$initrd"
          lsinitcpio "$initrd" > /tmp/initrd-list.txt
          # The archiso hook must be inside the initramfs or the live system
          # can never mount its squashfs (boot dies in the emergency shell).
          grep -q 'hooks/archiso' /tmp/initrd-list.txt
          # USB keyboard/mouse must work on arbitrary hardware, so the image
          # must not have been trimmed by mkinitcpio's `autodetect` (which
          # keys off the CI container's hardware). Each driver must be in the
          # initramfs as a module OR built into the kernel (modules.builtin —
          # CachyOS builds usbhid in, for example).
          builtin_list=$(cat /tmp/work/x86_64/airootfs/usr/lib/modules/*/modules.builtin)
          for drv in usbhid xhci; do
            grep -q "$drv" /tmp/initrd-list.txt || echo "$builtin_list" | grep -q "$drv"
          done
          echo "✓ initramfs contains archiso hook + USB HID/xHCI drivers"

      - name: Install QEMU + OVMF firmware for boot tests
        run: |
          set -euxo pipefail
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed, retrying in 10s"; sleep 10; done; return 1; }
          retry pacman -S --noconfirm edk2-ovmf
          # The package name for the QEMU system-emulation target has moved
          # across Arch releases (qemu-system-x86 vs qemu-full); try known
          # candidates in order instead of hardcoding one.
          pacman -S --noconfirm qemu-system-x86 qemu-img \
            || pacman -S --noconfirm qemu-system-x86_64 qemu-img \
            || retry pacman -S --noconfirm qemu-full
          command -v qemu-system-x86_64 >/dev/null || { echo "::error::qemu-system-x86_64 not found after install attempts"; exit 1; }
          command -v qemu-img >/dev/null || { echo "::error::qemu-img not found after install attempts"; exit 1; }
          ls -la /dev/kvm || echo "::warning::/dev/kvm not present in this container — boot tests will fail fast with a clear message"

      - name: SPEC §19 CI gate — QEMU boot matrix
        run: |
          set -euxo pipefail
          mkdir -p /tmp/qemu-logs
          iso=$(ls /tmp/out/*.iso)
          echo "=== UEFI boot (OVMF) ==="
          bash ci/qemu/boot-uefi.sh "$iso" /tmp/qemu-logs
          echo "=== BIOS boot (SeaBIOS) ==="
          bash ci/qemu/boot-bios.sh "$iso" /tmp/qemu-logs
          echo "=== Live amnesic zero-write guarantee (SPEC §8) ==="
          bash ci/qemu/test-amnesic.sh "$iso" /tmp/qemu-logs
          echo "=== copytoram session stability (SPEC §8) ==="
          bash ci/qemu/test-copytoram.sh "$iso" /tmp/qemu-logs
          echo "=== Ventoy compatibility, basic (SPEC §17) ==="
          bash ci/qemu/test-ventoy.sh "$iso" /tmp/qemu-logs
          echo "✓ SPEC §19 QEMU boot matrix passed"

      - name: Upload QEMU serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-logs
          path: /tmp/qemu-logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Report artifact
        run: |
          ls -lh /tmp/out/
          echo "✓ Phase 1 gate: ISO built + boot structure verified (UEFI + BIOS)"
          echo "✓ Phase 1 gate: QEMU boot matrix verified (UEFI, BIOS, amnesic, copytoram, Ventoy)"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: enigma-iso
          path: /tmp/out/*.iso
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
