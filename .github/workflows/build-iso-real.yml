name: ISO Build (Arch container)

# Phases 1-2 gate: build the real Enigma OS ISO in an Arch Linux container.
# Runs separately from the main test workflow because it is heavy (GBs of
# downloads, tens of minutes). A fast package-resolution job gates the
# expensive mkarchiso build so bad package names fail in ~2 min, not ~30.

on:
  push:
    branches: [main]
    paths:
      - 'iso/**'
      - '.github/workflows/build-iso-real.yml'
  workflow_dispatch:

jobs:
  resolve-packages:
    name: Validate package list resolves
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Refresh base + install tooling
        run: pacman -Syu --noconfirm archiso git curl sed grep

      - name: Enable CachyOS repositories
        run: |
          set -euxo pipefail
          pacman-key --init
          curl -fsSL https://mirror.cachyos.org/cachyos-repo.tar.xz -o /tmp/cachyos-repo.tar.xz
          tar xf /tmp/cachyos-repo.tar.xz -C /tmp
          # Run the official installer non-interactively. pipefail is off for
          # this pipe so `yes` dying via SIGPIPE doesn't mask the real exit.
          set +o pipefail
          yes | (cd /tmp/cachyos-repo && ./cachyos-repo.sh --install)
          rc=$?
          set -o pipefail
          [ $rc -eq 0 ]
          pacman -Sy

      - name: Enable Chaotic-AUR (for calamares)
        run: |
          set -euxo pipefail
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          if ! grep -q '\[chaotic-aur\]' /etc/pacman.conf; then
            printf '\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist\n' >> /etc/pacman.conf
          fi
          pacman -Sy

      - name: Check every ISO package resolves
        run: |
          set -uo pipefail
          missing=()
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            case "$pkg" in \#*) continue;; esac
            if ! pacman -Si "$pkg" >/dev/null 2>&1; then
              missing+=("$pkg")
            fi
          done < <(grep -vE '^\s*#' iso/packages.x86_64 | sed 's/#.*//' | tr -d ' \t' | grep -v '^$')

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Unresolvable packages: ${missing[*]}"
            for pkg in "${missing[@]}"; do
              echo "--- candidates for '$pkg' ---"
              pacman -Ss "$pkg" 2>/dev/null | head -20 || echo "(no matches)"
            done
            echo "--- repos with a calamares match ---"
            pacman -Sl chaotic-aur 2>/dev/null | grep -i calamares || echo "(none in chaotic-aur)"
            exit 1
          fi
          echo "✓ All packages resolve"

  build-iso:
    name: Build ISO with mkarchiso
    needs: resolve-packages
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install archiso + repos
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm archiso git curl sed grep
          pacman-key --init
          curl -fsSL https://mirror.cachyos.org/cachyos-repo.tar.xz -o /tmp/cachyos-repo.tar.xz
          tar xf /tmp/cachyos-repo.tar.xz -C /tmp
          set +o pipefail
          yes | (cd /tmp/cachyos-repo && ./cachyos-repo.sh --install)
          rc=$?
          set -o pipefail
          [ $rc -eq 0 ]
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          if ! grep -q '\[chaotic-aur\]' /etc/pacman.conf; then
            printf '\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist\n' >> /etc/pacman.conf
          fi
          pacman -Sy

      - name: Build ISO
        run: mkarchiso -v -w /tmp/work -o /tmp/out iso/

      - name: Report artifact
        run: |
          ls -lh /tmp/out/
          echo "✓ Phase 1 gate: ISO built successfully"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: enigma-iso
          path: /tmp/out/*.iso
          retention-days: 7
          if-no-files-found: error
